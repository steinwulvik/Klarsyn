<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Klarsyn: concept demo for explainable credit decisions and early warning at the fictional Lysvik Bank (synthetic data).">
<title>Klarsyn – Lysvik Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lys toppmeny med to faner (løsningsforslag / konseptdemo) og undermeny, sentrert arbeidsflate. Indigo for handling, rav for «hva måtte vært annerledes». */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#ECEEF5; --ink:#161B2E; --muted:#555E78; --line:#D9DDEA;
  --accent:#3D46B8; --accent-ink:#FFFFFF; --accent-soft:#E6E8FB; --glow:#B87A0E;
  --ok:#1B7244; --ok-soft:#DCF1E4; --warn:#8A5300; --warn-soft:#FAEBCF; --bad:#B0281F; --bad-soft:#F8DEDB; --info:#2C6599; --info-soft:#DFEBF6;
  --head:#252C6E; --head-2:#2E3680; --head-ink:#FFFFFF; --head-muted:#C3C7EE; --head-line:#3A4290;
  --f-display:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:12px; --r-s:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1220; --surface:#171B2D; --surface-2:#20253B; --ink:#E6E8F2; --muted:#A3A9C2; --line:#2C3250;
  --accent:#9AA3FF; --accent-ink:#11143A; --accent-soft:#262C5A; --glow:#E7B04A;
  --ok:#62C98E; --ok-soft:#14382A; --warn:#EDB04E; --warn-soft:#3A2B11; --bad:#F2877E; --bad-soft:#431C19; --info:#86B6E8; --info-soft:#18304A;
  --head:#1B2052; --head-2:#21275F; --head-ink:#F2F3FF; --head-muted:#AEB3E0; --head-line:#2E3573;
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#171B2D; --surface-2:#20253B; --ink:#E6E8F2; --muted:#A3A9C2; --line:#2C3250;
  --accent:#9AA3FF; --accent-ink:#11143A; --accent-soft:#262C5A; --glow:#E7B04A;
  --ok:#62C98E; --ok-soft:#14382A; --warn:#EDB04E; --warn-soft:#3A2B11; --bad:#F2877E; --bad-soft:#431C19; --info:#86B6E8; --info-soft:#18304A;
  --head:#1B2052; --head-2:#21275F; --head-ink:#F2F3FF; --head-muted:#AEB3E0; --head-line:#2E3573;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--head)}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance; margin:0}
h1{font-family:var(--f-display); font-weight:800; font-size:clamp(28px,4vw,40px); line-height:1.12; letter-spacing:-.025em}
h2{font-family:var(--f-display); font-weight:700; font-size:23px; line-height:1.2; letter-spacing:-.015em}
h3{font-size:15px; font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono); font-size:.88em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--muted)}
:focus-visible{outline:2px solid var(--glow); outline-offset:2px}

.content{margin-inline:auto; padding-block:8px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); width:100%; max-width:1180px}
.content.narrow{max-width:980px}

/* Regelverksbryter */
.regime{display:flex; align-items:center; gap:8px; font-size:13px}
.regime[hidden]{display:none}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden; background:var(--surface)}
.seg button{font:inherit; font-size:12.5px; padding:5px 11px; border:0; background:transparent; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}

/* Felles komponenter */
.stack{display:flex; flex-direction:column; gap:16px}
.stack-l{display:flex; flex-direction:column; gap:28px}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; min-width:0}
.panel > h3{margin-bottom:10px}
h2.h-card{font-family:var(--f-body); font-size:15px; font-weight:600; line-height:1.55; letter-spacing:0}
.panel > h2.h-card{margin-bottom:10px}
.panel-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.lede{font-size:17px; line-height:1.6; max-width:68ch; color:var(--ink)}
.prose{max-width:68ch; display:flex; flex-direction:column; gap:10px}
.btn{font:inherit; font-size:14px; font-weight:600; border-radius:var(--r-s); padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 40%, var(--line))}
.btn.sm{font-size:12.5px; padding:5px 10px}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; background:var(--surface-2); color:var(--muted)}
.pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.info{background:var(--info-soft); color:var(--info)}
.pill.acc{background:var(--accent-soft); color:var(--accent)}
.dot{width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block}
.note{display:flex; gap:10px; align-items:flex-start; background:var(--info-soft); color:var(--ink); border-radius:var(--r-s); padding:10px 14px; font-size:13.5px}
.note b{color:var(--info)}
.note.warn{background:var(--warn-soft)} .note.warn b{color:var(--warn)}
.note.ok{background:var(--ok-soft)} .note.ok b{color:var(--ok)}
.sample{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); background:var(--accent-soft); border-radius:var(--r-s); padding:9px 14px; font-size:13px}
.sample b{color:var(--accent)}
.tbl-wrap{position:relative; overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th{text-align:left; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); white-space:nowrap}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
#caseRows .mono{white-space:nowrap}
.tbl-wrap table{min-width:720px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:4px; min-width:0}
.kpi .v{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.kpi .l{font-size:12.5px; color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
label.f{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600}
label.f span.h{font-weight:400; color:var(--muted); font-size:12.5px}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--surface); color:var(--ink); width:100%}
textarea{min-height:120px; resize:vertical; line-height:1.5}
.choice{display:flex; flex-wrap:wrap; gap:8px}
.choice label{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:var(--r-s); padding:7px 11px; font-size:13.5px; cursor:pointer; background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.choice input{accent-color:var(--accent); margin:0}
.chk{display:flex; gap:9px; align-items:flex-start; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{accent-color:var(--accent); margin-top:4px}
.chk small{display:block; color:var(--muted); font-size:12.5px}
.ev{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.ev:last-child{border-bottom:0}
.ev .src{font-size:12px; color:var(--muted)}
.ico{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700}
.ico.ok{background:var(--ok-soft); color:var(--ok)} .ico.bad{background:var(--bad-soft); color:var(--bad)} .ico.warn{background:var(--warn-soft); color:var(--warn)} .ico.na{background:var(--surface-2); color:var(--muted)}

/* Fristklokke */
.clock{display:flex; gap:14px; align-items:center}
.clock .ring{--p:0; width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%), var(--surface-2) 0); display:grid; place-items:center; flex:none}
.clock .ring i{width:48px; height:48px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-style:normal; font-weight:700; font-size:15px; font-variant-numeric:tabular-nums}
.deadline{font-variant-numeric:tabular-nums; white-space:nowrap}
.deadline.bad{color:var(--bad); font-weight:600} .deadline.warn{color:var(--warn); font-weight:600}

/* Triage */
.triage{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.triage .head{padding:14px 18px; display:flex; flex-direction:column; gap:4px; border-bottom:1px solid var(--line)}
.triage .head.t-uaut{background:var(--info-soft)} .triage .head.t-psr{background:var(--ok-soft)} .triage .head.t-autbank{background:var(--warn-soft)} .triage .head.t-annen{background:var(--surface-2)} .triage .head.t-ukjent{background:var(--surface-2)}
.triage .head b{font-size:16px}
.triage ol{margin:0; padding:12px 18px 14px 38px; display:flex; flex-direction:column; gap:6px; font-size:14px}
.triage .basis{padding:0 18px 14px; font-size:12.5px; color:var(--muted)}
.suggest{border-left:3px solid var(--accent); background:var(--accent-soft); padding:12px 16px; border-radius:0 var(--r-s) var(--r-s) 0; display:flex; flex-direction:column; gap:6px}
.suggest b{font-size:15px}

/* Tidslinje / logg */
.log{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.log li{display:grid; grid-template-columns:96px minmax(0,1fr); gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.log li:last-child{border-bottom:0}
.log time{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px}

/* Behov-kort og prosess */
.needs{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.need{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:grid; grid-template-columns:34px minmax(0,1fr); gap:4px 12px}
.need .k{font-family:var(--f-mono); font-size:12px; color:var(--accent); font-weight:500; padding-top:2px}
.need h3{font-size:15px}
.need p{grid-column:2; font-size:13.5px; color:var(--muted)}
.need a{grid-column:2; font-size:13px; font-weight:600; text-decoration:none}
.steps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; counter-reset:s}
.step{padding:16px 18px 16px 0; border-top:3px solid var(--line); position:relative; display:flex; flex-direction:column; gap:6px}
.step.on{border-top-color:var(--accent)}
.step .eyebrow{color:var(--accent)}
.step p{font-size:13.5px; color:var(--muted)}
.hero{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:28px; align-items:end; padding-bottom:6px}
.meta{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0; font-weight:500}

/* Business case */
.bc{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px}
.slider{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:8px 0; border-bottom:1px solid var(--line)}
.slider:last-child{border-bottom:0}
.slider label{font-size:13.5px}
.slider output{font-variant-numeric:tabular-nums; font-weight:600; font-size:13.5px; text-align:right}
.slider input{grid-column:1 / -1; accent-color:var(--accent); width:100%}
.slider small{grid-column:1 / -1; color:var(--muted); font-size:12px}
.bcline{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
.bcline span:last-child{font-variant-numeric:tabular-nums; font-weight:600; text-align:right}
.bcline.tot{border-bottom:0; border-top:2px solid var(--ink); font-size:16px; padding-top:12px}
.bcbar{height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden; display:flex}
.bcbar i{display:block; height:100%}

/* Diagram */
.arch{overflow-x:auto}
.arch svg{min-width:720px; width:100%; height:auto; display:block}
.arch text{font-family:var(--f-body)}

/* Gantt */
.gantt{display:grid; grid-template-columns:200px minmax(0,1fr); gap:8px 14px; align-items:center; font-size:13.5px}
.gantt .track{position:relative; height:26px; background:var(--surface-2); border-radius:4px}
.gantt .bar{position:absolute; top:3px; bottom:3px; border-radius:3px; background:var(--accent); color:var(--accent-ink); font-size:11.5px; font-weight:600; display:flex; align-items:center; padding:0 8px; white-space:nowrap; overflow:hidden}
.gantt .bar.alt{background:var(--glow); color:#04222A}
.gantt .bar.ghost{background:transparent; border:1.5px dashed var(--accent); color:var(--accent)}
.gantt .scale{position:relative; height:16px; font-size:11.5px; color:var(--muted); font-family:var(--f-mono)}
.gantt .scale span{position:absolute; transform:translateX(-50%)} .gantt .scale span:first-child{transform:none} .gantt .scale span:last-child{transform:translateX(-100%)}
.gantt .lab small{display:block; font-size:12px; color:var(--muted); font-weight:400}

/* Søyler */
.bars{display:flex; flex-direction:column; gap:8px}
.bars .b{display:grid; grid-template-columns:150px minmax(0,1fr) 54px; gap:10px; align-items:center; font-size:13px}
.bars .b .t{height:14px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.bars .b .t i{display:block; height:100%; background:var(--accent); border-radius:3px}
.bars .b span:last-child{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.cols{display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:8px; border-bottom:1px solid var(--line)}
.cols .c{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; min-width:0}
.cols .c .stk{width:100%; max-width:44px; display:flex; flex-direction:column-reverse; border-radius:3px 3px 0 0; overflow:hidden}
.cols .c .stk i{display:block; width:100%}
.cols .c b{font-size:12px; font-variant-numeric:tabular-nums}
.colx{display:flex; gap:10px; font-size:11.5px; color:var(--muted)} .colx span{flex:1; text-align:center}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}

.toast{position:fixed; right:max(20px, calc(env(safe-area-inset-right,0px) + 20px)); bottom:calc(env(safe-area-inset-bottom,0px) + 20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--r-s); font-size:14px; z-index:20; box-shadow:0 6px 24px rgba(0,0,0,.2)}
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.split{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:20px; align-items:start}
.sticky{position:sticky; top:72px}
.sources li{margin-bottom:6px; font-size:13.5px}
.hr{height:1px; background:var(--line); border:0; margin:4px 0}

@media (max-width:1080px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:minmax(0,1fr)} .sticky{position:static} .hero{grid-template-columns:minmax(0,1fr)} .bc{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .grid2,.grid3,.needs{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gantt{grid-template-columns:minmax(0,1fr)} .gantt .lab{font-weight:600}
}
@media (max-width:480px){ .kpis{grid-template-columns:minmax(0,1fr)} .steps{grid-template-columns:minmax(0,1fr)} .bars .b{grid-template-columns:100px minmax(0,1fr) 44px} }
@media (prefers-reduced-motion:no-preference){ .view{animation:fade .25s ease-out} @keyframes fade{from{opacity:.4; transform:translateY(4px)} to{opacity:1; transform:none}} }
.tools{display:flex; align-items:center; gap:12px; margin-left:auto; flex-wrap:wrap}
.lang-switch{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex-shrink:0}
.lang-switch button{border:0; background:var(--surface); color:var(--muted); font:inherit; font-size:12px; font-weight:700; letter-spacing:.04em; padding:4px 10px; min-height:30px; min-width:40px; cursor:pointer}
.lang-switch button+button{border-left:1px solid var(--line)}
.lang-switch button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.lang-switch button:hover:not([aria-pressed="true"]){background:var(--accent-soft); color:var(--ink)}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

/* Tillegg for Klarsyn */
[hidden]{display:none !important}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}
.factors{display:flex; flex-direction:column}
.factor{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.factor:last-child{border-bottom:0}
.factor small{display:block; color:var(--muted); font-size:12.5px}
.factor .val{font-variant-numeric:tabular-nums; font-weight:600; text-align:right; white-space:nowrap}
.letter{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; font-size:14px; display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 0 var(--line)}
.letter h3{margin:0; font-size:16px; font-weight:700; font-family:var(--f-display)}
.letter ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.letter .sig{color:var(--muted); font-size:13px}
.rights{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.rights li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.rights li:last-child{border-bottom:0}
.rights li small{grid-column:1 / -1; color:var(--muted); font-size:12px}
.flag{display:inline-flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:11px; font-weight:600; border:1px solid var(--line); border-radius:4px; padding:0 5px; min-width:26px; color:var(--muted); background:var(--surface)}
.cf{border-left:3px solid var(--glow); background:var(--accent-soft); padding:12px 16px; border-radius:0 var(--r-s) var(--r-s) 0; display:flex; flex-direction:column; gap:4px; font-size:14px}
.stages{display:flex; flex-wrap:wrap; gap:0; font-size:12.5px}

<script>
// ---------- Hjelpere ----------
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, f){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

// ---------- Språk ----------
let LANG = (() => { try{ const v = sessionStorage.getItem('ci_lang'); if(v==='no'||v==='en') return v; }catch(e){} return 'en'; })();
const L = (no, en) => LANG === 'en' ? en : no;
const tx = v => v == null ? '' : typeof v === 'string' ? v : (LANG === 'en' ? (v.en ?? v.no) : v.no);
const Lg = (no, en) => ({no, en});
const LOC = () => LANG === 'en' ? 'en-GB' : 'nb-NO';
const num = n => new Intl.NumberFormat(LOC(), {maximumFractionDigits:0}).format(Math.round(n));
const money = (n, cur) => LANG === 'en' ? `${cur} ${num(n)}` : `${num(n)} ${cur === 'NOK' ? 'kr' : 'SEK'}`;
const pct = (v, d=0) => Number(v).toLocaleString(LOC(), {maximumFractionDigits:d, minimumFractionDigits:d}) + (LANG === 'en' ? '%' : ' %');
const fmtD = d => d ? d.toLocaleDateString(LOC(), {day:'numeric', month:'short', year:'numeric'}) : '–';
const fmtDs = d => d ? d.toLocaleDateString(LOC(), {day:'numeric', month:'short'}) : '–';
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseIso = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const TODAY = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
const daysAgo = n => { const d = new Date(TODAY); d.setDate(d.getDate()-n); return d; };
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }

const SHELL = {
  mainMenu:['Hovedmeny','Main menu'], brandSub:['Forklarbar kreditt og tidlig varsling','Explainable credit and early warning'],
  grpProposal:['Løsningsforslag','Solution proposal'], grpDemo:['Konseptdemo','Concept demo'],
  forslag:['Introduksjon','Introduction'], regelverk:['Regelverket','The rules'], losning:['Løsning og integrasjon','Solution and integration'], business:['Business case','Business case'], 'veien-videre':['Veien videre','Next steps'], om:['Om løsningsforslaget','About the proposal'],
  soknader:['Kredittsøknader','Credit applications'], varsling:['Tidlig varsling','Early warning'], innsikt:['Innsikt og etterlevelse','Insights and compliance'],
  sideFoot:['Konseptdemo. Lysvik Bank er en fiktiv bank, og alle kunder og saker er eksempeldata.','Concept demo. Lysvik Bank is a fictional bank, and all customers and cases are sample data.'],
  reset:['Tilbakestill demodata','Reset demo data'], lang:['Språk','Language'], crumbNav:['Du er her','You are here']
};
const S = k => L(SHELL[k][0], SHELL[k][1]);
function applyShell(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'nb';
  $$('[data-i18n]').forEach(el => el.textContent = S(el.dataset.i18n));
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', S(el.dataset.i18nAria)));
  $('#langSwitch').setAttribute('aria-label', S('lang'));
  $$('#langSwitch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  const cl = $('#custLogo'); if(cl && !cl.innerHTML) cl.innerHTML = lysvikLogo(true, 26);
  if(cl) cl.title = L('Kunde: Lysvik Bank (fiktiv)','Customer: Lysvik Bank (fictional)');
}

// ---------- Logo for Lysvik Bank (fiktiv) ----------
function lysvikLogo(onDark, h = 30){
  const wave = onDark ? '#86D6D2' : '#0F6E74', txt = onDark ? '#FFFFFF' : 'var(--ink)';
  return `<svg class="lysvik" height="${h}" viewBox="0 0 136 32" role="img" aria-label="Lysvik Bank"><circle cx="16" cy="13" r="6.5" fill="#F0AE3C"/><path d="M2.5 21.5 Q16 14 29.5 21.5" fill="none" stroke="${wave}" stroke-width="2.6" stroke-linecap="round"/><path d="M6.5 27 Q16 22 25.5 27" fill="none" stroke="${wave}" stroke-width="2.2" stroke-linecap="round" opacity=".7"/><text x="36" y="21.5" fill="${txt}" font-family="Manrope, 'Segoe UI', sans-serif"><tspan font-size="17" font-weight="800" letter-spacing="-.3">Lysvik</tspan><tspan dx="5" font-size="9.5" font-weight="700" letter-spacing="1.6">BANK</tspan></text></svg>`;
}

// ---------- Land og regler ----------
// Lysvik Banks kredittpolicy er fiktiv. Regelhenvisningene er reelle (se «Regelverket»).
const COUNTRY = {
  NO:{ name:['Norge','Norway'], cur:'NOK', living:11500, child:3800, maxTerm:60 },
  SE:{ name:['Sverige','Sweden'], cur:'SEK', living:12000, child:4000, maxTerm:null }
};
const cn = c => L(...COUNTRY[c].name);
const POLICY = { tax:0.28, stress:3, maxDti:5, unsecuredMonthly:0.02, minMargin:2000 };
const PRODUCT = { forbrukslan:{t:['Forbrukslån','Consumer loan'], rate:12.9}, kredittkort:{t:['Kredittkort','Credit card'], rate:19.9} };
const prod = k => L(...PRODUCT[k].t);
const pmt = (P, ratePct, n) => { const r = ratePct/100/12; return r === 0 ? P/n : P*r/(1-Math.pow(1+r,-n)); };

// Kredittvurdering etter Lysvik Banks (fiktive) policy. Returnerer faktorer, utfall og forklaringsgrunnlag.
function assess(a, over = {}){
  const x = {...a, ...over};
  const C = COUNTRY[x.country];
  const net = x.income * (1 - POLICY.tax) / 12;
  const living = x.adults * C.living + x.kids * C.child;
  const unsecPay = x.unsecured * POLICY.unsecuredMonthly;
  const term = x.product === 'kredittkort' ? 36 : x.term;
  const newPay = pmt(x.amount, PRODUCT[x.product].rate + POLICY.stress, term);
  const margin = net - x.housing - living - unsecPay - newPay;
  const dti = (x.unsecured + x.mortgage + x.amount) / x.income;
  const F = [];
  F.push({ k:'remark', ok:!x.remark, hard:true, label:Lg('Betalingsanmerkninger','Payment remarks'), val: x.remark ? Lg('Registrert','Registered') : Lg('Ingen','None'), src:'bureau',
    why: Lg('Lysvik Bank innvilger ikke usikret kreditt så lenge en betalingsanmerkning er registrert.','Lysvik Bank does not grant unsecured credit while a payment remark is registered.') });
  F.push({ k:'margin', ok:margin >= 0, warn:margin >= 0 && margin < POLICY.minMargin, hard:true, label:Lg('Betjeningsevne med renteøkning','Ability to pay with a rate increase'), val: money(margin, C.cur) + L(' per mnd.',' per month'), src:'calc',
    why: Lg(`Etter skatt, boutgifter, livsopphold og alle lån, med ${POLICY.stress} prosentpoeng høyere rente, må det være penger igjen hver måned.`, `After tax, housing, living costs and all loans, with the rate ${POLICY.stress} percentage points higher, money must be left over each month.`) });
  F.push({ k:'dti', ok:dti <= POLICY.maxDti, hard:true, label:Lg('Samlet gjeld mot inntekt','Total debt to income'), val: (Math.round(dti*10)/10).toLocaleString(LOC()) + ' ×', src:'register',
    why: Lg(`Samlet gjeld kan ikke være mer enn ${POLICY.maxDti} ganger brutto årsinntekt i Lysvik Banks policy.`, `Total debt may not exceed ${POLICY.maxDti} times gross annual income under Lysvik Bank's policy.`) });
  F.push({ k:'job', ok:x.job === 'fast', warn:x.job !== 'fast', hard:false, label:Lg('Ansettelse','Employment'), val: L(...JOB[x.job]), src:'applicant',
    why: Lg('Midlertidig ansettelse eller egen næring gir manuell vurdering, ikke avslag.','Temporary employment or self-employment leads to manual review, not rejection.') });
  const fail = F.filter(f => f.hard && !f.ok);
  const outcome = fail.length ? 'avslag' : F.some(f => f.warn) ? 'manuell' : 'innvilget';
  return { F, fail, outcome, margin, dti, net, living, unsecPay, newPay, term, x };
}
const JOB = { fast:['Fast ansatt','Permanent'], midlertidig:['Midlertidig ansatt','Temporary'], selvstendig:['Selvstendig næringsdrivende','Self-employed'] };

// «Hva måtte vært annerledes»: minste endring i beløp eller løpetid som gir innvilget.
function counterfactual(a){
  const r = assess(a);
  if(r.outcome !== 'avslag') return null;
  if(r.fail.some(f => f.k === 'remark')) return { kind:'remark' };
  const out = [];
  for(let amt = Math.floor(a.amount/10000)*10000; amt >= 10000; amt -= 10000){
    const o = assess(a, {amount:amt}).outcome; if(o !== 'avslag'){ out.push({ kind:'amount', amount:amt, out:o }); break; }
  }
  if(a.product === 'forbrukslan'){
    const mx = COUNTRY[a.country].maxTerm || 120;
    for(const t of [72, 84, 96, 120]){ if(t > a.term && t <= mx){ const o = assess(a, {term:t}).outcome; if(o !== 'avslag'){ out.push({ kind:'term', term:t, out:o }); break; } } }
  }
  if(a.unsecured > 0){ const o = assess(a, {unsecured:0}).outcome; if(o !== 'avslag') out.push({ kind:'unsecured', out:o }); }
  return out.length ? out : [{ kind:'none' }];
}

// Regneeksempel med fiktive antakelser. Alle beløp i NOK (svenske tall omregnet).
const BC_SCEN = {
  low:{ t:['Forsiktig','Cautious'], avoid:10, minNew:50, ramp:40 },
  mid:{ t:['Forventet','Expected'], avoid:15, minNew:35, ramp:50 },
  high:{ t:['Optimistisk','Optimistic'], avoid:25, minNew:25, ramp:70 }
};
const BC_DEF = { scen:'mid', loans:45000, bal:90000, toColl:2, avoid:15, lgdColl:60, lgdAgr:25,
  rej:25000, ask:6, minNow:90, minNew:35, hour:900, impl:4000000, lic:1500000, ops:500000, ramp:50 };
let BC = { ...BC_DEF };
const BC_FIELDS = [
  { g:Lg('Tidlig varsling','Early warning'), f:[
    ['loans', Lg('Usikrede lån i porteføljen','Unsecured loans in the portfolio'), '', 1000],
    ['bal', Lg('Snittsaldo','Average balance'), 'kr', 5000],
    ['toColl', Lg('Andel som går til inkasso per år','Share handed to collection per year'), '%', 0.5],
    ['avoid', Lg('Andel av disse som unngås med tidlig tilbud','Share of these avoided by an early offer'), '%', 1],
    ['lgdColl', Lg('Tap når saken går til inkasso','Loss when the case goes to collection'), '%', 5],
    ['lgdAgr', Lg('Tap når kunden får en avtale','Loss when the customer gets an agreement'), '%', 5]
  ]},
  { g:Lg('Avslag og ny vurdering','Rejections and review'), f:[
    ['rej', Lg('Avslag per år','Rejections per year'), '', 1000],
    ['ask', Lg('Andel som ber om forklaring eller ny vurdering','Share asking for an explanation or review'), '%', 1],
    ['minNow', Lg('Minutter per sak i dag','Minutes per case today'), 'min', 5],
    ['minNew', Lg('Minutter per sak med Klarsyn','Minutes per case with Klarsyn'), 'min', 5],
    ['hour', Lg('Kostnad per saksbehandlertime','Cost per case handler hour'), 'kr', 50]
  ]},
  { g:Lg('Kostnader','Costs'), f:[
    ['impl', Lg('Innføring (engang)','Implementation (one-off)'), 'kr', 100000],
    ['lic', Lg('Lisens per år','Licence per year'), 'kr', 100000],
    ['ops', Lg('Intern forvaltning per år','Internal operation per year'), 'kr', 50000],
    ['ramp', Lg('Gevinst år 1 (opptrapping)','Benefit in year 1 (ramp-up)'), '%', 10]
  ]}
];

function bcCalc(B){
  const avoided = B.loans * B.toColl/100 * B.avoid/100;
  const loss = avoided * B.bal * Math.max(0, B.lgdColl - B.lgdAgr)/100;
  const cases = B.rej * B.ask/100;
  const hours = cases * Math.max(0, B.minNow - B.minNew)/60;
  const work = hours * B.hour;
  const benefit = loss + work, run = B.lic + B.ops;
  const years = [1,2,3].map(y => { const b = benefit * (y === 1 ? B.ramp/100 : 1); const c = run + (y === 1 ? B.impl : 0); return { y, b, c, n:b - c }; });
  let acc = 0; years.forEach(r => { acc += r.n; r.acc = acc; });
  // Tilbakebetalingstid i måneder (jevn fordeling innen hvert år)
  let pay = null, cum = -B.impl;
  for(let m = 1; m <= 60 && pay == null; m++){ const y = Math.ceil(m/12); cum += (benefit * (y === 1 ? B.ramp/100 : 1) - run)/12; if(cum >= 0) pay = m; }
  return { avoided, loss, cases, hours, work, benefit, run, years, pay };
}
const mnok = v => LANG === 'en' ? `NOK ${(v/1e6).toLocaleString('en-GB', {maximumFractionDigits:1, minimumFractionDigits:1})}m` : `${(v/1e6).toLocaleString('nb-NO', {maximumFractionDigits:1, minimumFractionDigits:1})} mill. kr`;

function bcResults(){
  const r = bcCalc(BC), y2 = r.years[1];
  const max = Math.max(r.loss, r.work, r.run, 1);
  const bar = (lbl, v, cls) => `<div class="bcrow"><span>${lbl}</span><span class="trk"><i class="${cls}" style="width:${Math.max(2, v/max*100)}%"></i></span><b>${mnok(v)}</b></div>`;
  return `<div class="kpis bc-k">
      <div class="kpi t-ok"><span class="v">${mnok(r.benefit)}</span><span class="l">${L('Gevinst per år ved full effekt','Benefit per year at full effect')}</span></div>
      <div class="kpi t-warn"><span class="v">${mnok(r.run)}</span><span class="l">${L('Løpende kostnad per år','Running cost per year')}</span></div>
      <div class="kpi ${y2.n >= 0 ? 't-acc' : 't-bad'}"><span class="v">${mnok(y2.n)}</span><span class="l">${L('Netto per år fra år 2','Net per year from year 2')}</span></div>
      <div class="kpi t-info"><span class="v">${r.pay == null ? L('Over 5 år','Over 5 yrs') : r.pay + ' ' + L('mnd.','mo.')}</span><span class="l">${L('Tilbakebetalingstid','Payback period')}</span></div>

    <div class="panel stack">

      ${bar(L('Lavere kredittap','Lower credit losses'), r.loss, 'ok')}
      ${bar(L('Mindre saksbehandling','Less case handling'), r.work, 'ok')}

      <p class="muted" style="font-size:13px; margin:0">${L(`Omtrent ${num(r.avoided)} saker per år unngår inkasso, og saksbehandlerne sparer omtrent ${num(r.hours)} timer på ${num(r.cases)} forespørsler.`, `About ${num(r.avoided)} cases a year avoid collection, and case handlers save about ${num(r.hours)} hours on ${num(r.cases)} requests.`)}</p>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th><span class="sr-only">${L('År','Year')}</span></th><th>${L('Gevinst','Benefit')}</th><th>${L('Kostnad','Cost')}</th><th>${L('Netto','Net')}</th><th>${L('Akkumulert','Cumulative')}</th></tr></thead><tbody>
      ${r.years.map(x => `<tr><td>${L('År','Year')} ${x.y}</td><td class="num">${mnok(x.b)}</td><td class="num">${mnok(x.c)}</td><td class="num">${mnok(x.n)}</td><td class="num"><b class="${x.acc >= 0 ? 'pos' : 'neg'}">${mnok(x.acc)}</b></td></tr>`).join('')}
    </tbody></table></div>`;
}

function factorList(r, a){
  return `<div class="factors">${r.F.map(f => { const cls = !f.ok && f.hard ? 'bad' : (f.warn || !f.ok) ? 'warn' : 'ok'; const ic = !f.ok && f.hard ? '✕' : (f.warn || !f.ok) ? '!' : '✓';
    return `<div class="factor"><span class="ico ${cls}">${ic}</span><div><b style="font-weight:600">${tx(f.label)}</b><small>${tx(f.why)}</small><small>${L('Kilde','Source')}: ${tx(SRC[f.src][a.country])}</small></div><span class="val">${tx(f.val)}</span></div>`; }).join('')}</div>`;
}
function cfText(a){
  const cf = counterfactual(a); if(!cf) return '';
  const cur = COUNTRY[a.country].cur;
  if(cf.kind === 'remark') return `<div class="cf"><b>${L('Hva måtte vært annerledes','What would have had to be different')}</b><span>${L('Søknaden kan ikke innvilges så lenge en betalingsanmerkning er registrert. Når den er slettet, kan kunden søke på nytt.','The application cannot be approved while a payment remark is registered. Once it is removed, the customer can apply again.')}</span></div>`;
  const res = c => c.out === 'manuell' ? L(' – gir manuell vurdering',' – leads to manual review') : c.out === 'innvilget' ? L(' – gir innvilgelse',' – leads to approval') : '';
  if(cf[0].kind === 'none') return `<div class="cf"><b>${L('Hva måtte vært annerledes','What would have had to be different')}</b><span>${L('Ingen enkel endring i beløp, løpetid eller annen gjeld gir et annet utfall. Inntekten eller de faste utgiftene må endres.','No simple change in amount, term or other debt gives a different outcome. Income or fixed costs would have to change.')}</span></div>`;
  const items = cf.map(c => (c.kind === 'amount' ? L(`Lånebeløp ${money(c.amount, cur)} i stedet for ${money(a.amount, cur)}`, `Loan amount ${money(c.amount, cur)} instead of ${money(a.amount, cur)}`)
    : c.kind === 'term' ? L(`Nedbetalingstid ${c.term} mnd. i stedet for ${a.term} mnd.`, `Repayment period ${c.term} months instead of ${a.term} months`)
    : c.kind === 'unsecured' ? L(`Annen usikret gjeld (${money(a.unsecured, cur)}) innfridd`, `Other unsecured debt (${money(a.unsecured, cur)}) repaid`)
    : '') + res(c));
  return `<div class="cf"><b>${L('Hva måtte vært annerledes','What would have had to be different')}</b><span>${L('Hver av disse endringene alene ville gitt et annet utfall:','Each of these changes on its own would have given a different outcome:')}</span><ul style="margin:0; padding-left:20px">${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
}
function letterHtml(a, r){
  const reasons = r.fail.map(f => f.k === 'remark' ? L('Det er registrert en betalingsanmerkning på deg.','A payment remark is registered against you.')
    : f.k === 'margin' ? L('Etter at faste utgifter og alle lån er betalt, ville du ikke hatt nok igjen hver måned hvis renten øker.','After fixed costs and all loans are paid, you would not have enough left each month if interest rates rise.')
    : L('Samlet gjeld ville blitt høyere enn bankens grense i forhold til inntekten din.','Your total debt would be higher than the bank\'s limit relative to your income.'));
  const srcs = [...new Set(r.F.filter(f => f.src !== 'calc').map(f => tx(SRC[f.src][a.country])))];
  const advice = a.country === 'SE' ? L('kommunens budsjett- og gjeldsrådgivning','your municipality\'s budget and debt advice service') : L('Navs økonomiske rådgivning','Nav\'s financial advice service');
  return `<div class="letter">${lysvikLogo(false, 28)}<span class="eyebrow">${L('Melding i nettbanken','Message in online banking')} · ${fmtD(parseIso(a.date))}</span>
    <h3>${L(`Svar på søknad om ${prod(a.product).toLowerCase()}`, `Response to your ${prod(a.product).toLowerCase()} application`)}</h3>
    <p>${L(`Hei ${esc(a.name.split(' ')[0])}. Vi kan dessverre ikke innvilge søknaden din om ${money(a.amount, COUNTRY[a.country].cur)}.`, `Hi ${esc(a.name.split(' ')[0])}. Unfortunately we cannot approve your application for ${money(a.amount, COUNTRY[a.country].cur)}.`)}</p>
    <b>${L('Hvorfor','Why')}</b><ul>${reasons.map(x => `<li>${x}</li>`).join('')}</ul>
    <b>${L('Opplysninger vi har brukt','Information we used')}</b><ul>${srcs.map(x => `<li>${x}</li>`).join('')}</ul>
    ${a.auto ? `<p>${L('Søknaden ble vurdert automatisk. Du kan be om at en saksbehandler vurderer den på nytt, legge til opplysninger og si din mening.','Your application was assessed automatically. You can ask for a case handler to review it, add information and give your view.')}</p>` : ''}
    <p>${L(`Har du behov for hjelp med økonomien, kan du kontakte ${advice}. Tjenesten er gratis.`, `If you need help with your finances, you can contact ${advice}. The service is free.`)}</p>
    <span class="sig">Lysvik Bank</span></div>`;
}

  } else if(NEEDS_HUMAN.has(a.status)){

      ${a.request ? `<div class="suggest"><b>${L('Kundens forklaring','The customer\'s statement')}</b><span>«${esc(tx(a.request.text))}»</span><span class="muted" style="font-size:13px">${L('Nye opplysninger','New information')}: ${esc(tx(a.request.changeLabel))}</span></div>` : `<div class="note"><b>${L('Hvorfor manuell','Why manual')}</b><span>${L('Ansettelsesforholdet gir manuell vurdering etter bankens policy.','The employment type triggers manual review under the bank\'s policy.')}</span></div>`}
      <div class="row"><span class="muted">${a.request ? L('Modellen med nye opplysninger','The model with new information') : L('Modellens vurdering','The model\'s assessment')}:</span><span class="pill ${OUT[base.outcome][1]}">${OUT[base.outcome][0]}</span><span class="muted num">${L('Betjeningsevne','Ability to pay')} ${money(base.margin, C.cur)} ${L('per mnd.','per month')}</span></div>
      <div class="choice" role="radiogroup" aria-label="${L('Beslutning','Decision')}">
        <label><input type="radio" name="dec" value="innvilget"> ${L('Innvilg','Approve')}</label>
        <label><input type="radio" name="dec" value="lavere"> ${L('Innvilg lavere beløp','Approve a lower amount')}</label>
        <label><input type="radio" name="dec" value="avslag"> ${a.request ? L('Avslag står','Rejection upheld') : L('Avslå','Reject')}</label></div>
      <label class="f" id="lowWrap" hidden>${L('Nytt beløp','New amount')} (${C.cur})<input type="number" id="lowAmt" value="${Math.max(10000, Math.round(a.amount * 0.6 / 10000) * 10000)}" min="10000" step="10000"></label>
      <label class="f">${L('Begrunnelse til kunden','Reasons for the customer')}<span class="h">${L('Minst 30 tegn. Teksten sendes til kunden og lagres i loggen.','At least 30 characters. The text is sent to the customer and saved in the log.')}</span><textarea id="decText" maxlength="800"></textarea></label>
      <label class="chk"><input type="checkbox" id="decAdvice"><span>${L('Kunden er henvist til gjeldsrådgivning','The customer has been referred to debt advice')}<small>${L('Påkrevd ved avslag','Required for rejections')}</small></span></label>
      <div class="row"><button class="btn primary" id="decSave">${L('Lagre beslutning','Save decision')}</button></div></div>`;
  } else if(a.review){
    action = `<div class="panel stack"><h2 class="h-card">${a.request ? L('Ny vurdering','Review') : L('Manuell vurdering','Manual review')}</h2><div class="suggest"><b>${a.review.decision === 'avslag' ? (a.request ? L('Avslag står','Rejection upheld') : L('Avslått','Rejected')) : L('Innvilget','Approved')}${a.review.amount ? ` · ${money(a.review.amount, C.cur)}` : ''}</b><span>${esc(tx(a.review.reason))}</span><span class="muted" style="font-size:13px">${esc(a.review.by)} · ${fmtD(parseIso(a.review.date))}</span></div></div>`;

AFTER.soknad = h => {
  const a = appById(h.slice(7)); if(!a) return;
  const o = $('#reqOpen'); if(o) o.addEventListener('click', () => { REQ_FORM = true; render(); });
  const c = $('#reqCancel'); if(c) c.addEventListener('click', () => { REQ_FORM = false; render(); });
  const sel = $('#reqChange'); if(sel) sel.addEventListener('change', () => $('#incWrap').hidden = sel.value !== 'income');
  const s = $('#reqSend'); if(s) s.addEventListener('click', () => {
    const text = $('#reqText').value.trim(); if(text.length < 10){ toast(L('Skriv kundens forklaring','Write the customer\'s statement')); return; }
    const k = $('#reqChange').value, cur = COUNTRY[a.country].cur;
    const change = k === 'income' ? { income:Math.max(0, Number($('#reqIncome').value) || a.income) } : k === 'unsecured' ? { unsecured:0 } : {};
    const label = k === 'income' ? Lg(`Ny årsinntekt ${money(change.income, cur)}`, `New annual income ${money(change.income, cur)}`) : k === 'unsecured' ? Lg('Annen usikret gjeld er innfridd','Other unsecured debt has been repaid') : Lg('Ingen nye opplysninger','No new information');
    a.request = { date:iso(TODAY), text:Lg(text, text), change, changeLabel:label };
    a.status = 'ny-vurdering'; a.log.push({ d:iso(TODAY), t:Lg('Kunden ba om ny vurdering','The customer requested a review') });
    REQ_FORM = false; saveApps(); render(); toast(L('Saken ligger nå i køen til saksbehandler','The case is now in the case handler queue'));
  });
  $$('input[name=dec]').forEach(r => r.addEventListener('change', () => { $('#lowWrap').hidden = r.value !== 'lavere' || !r.checked; }));
  const d = $('#decSave'); if(d) d.addEventListener('click', () => {
    const dec = ($('input[name=dec]:checked') || {}).value, text = $('#decText').value.trim();
    if(!dec){ toast(L('Velg en beslutning','Choose a decision')); return; }
    if(text.length < 30){ toast(L('Begrunnelsen må være minst 30 tegn','The reasons must be at least 30 characters')); return; }
    if(dec === 'avslag' && !$('#decAdvice').checked){ toast(L('Henvis kunden til gjeldsrådgivning ved avslag','Refer the customer to debt advice for a rejection')); return; }
    const amount = dec === 'lavere' ? Math.max(10000, Number($('#lowAmt').value) || 10000) : null;
    a.review = { date:iso(TODAY), by:L('Deg (demo)','You (demo)'), decision: dec === 'avslag' ? 'avslag' : 'innvilget', amount, reason:Lg(text, text) };
    const manual = !a.request;
    a.status = manual ? (dec === 'avslag' ? 'manuell-avslatt' : 'manuell-innvilget') : (dec === 'avslag' ? 'vurdert-avslatt' : 'vurdert-innvilget');
    a.log.push({ d:iso(TODAY), t: manual ? (dec === 'avslag' ? Lg('Manuell vurdering: avslått. Begrunnelse sendt til kunden.','Manual review: rejected. Reasons sent to the customer.') : Lg(`Manuell vurdering: innvilget${amount ? ' ' + money(amount, COUNTRY[a.country].cur) : ''}. Begrunnelse sendt til kunden.`, `Manual review: approved${amount ? ' ' + money(amount, COUNTRY[a.country].cur) : ''}. Reasons sent to the customer.`)) : dec === 'avslag' ? Lg('Ny vurdering: avslag står. Begrunnelse sendt til kunden.','Review: rejection upheld. Reasons sent to the customer.') : Lg(`Ny vurdering: innvilget${amount ? ' ' + money(amount, COUNTRY[a.country].cur) : ''}. Begrunnelse sendt til kunden.`, `Review: approved${amount ? ' ' + money(amount, COUNTRY[a.country].cur) : ''}. Reasons sent to the customer.`) });
    saveApps(); render(); toast(L('Beslutningen er lagret og sendt til kunden','The decision is saved and sent to the customer'));
  });
};

// ---------- Tidlig varsling ----------
function vVarsling(){
  const act = LOANS.filter(l => !['avtale','inkasso'].includes(l.stage));
  const cnt = k => LOANS.filter(l => l.stage === k).length;
  return `<div class="stack-l">
    <div class="stack"><div class="eyebrow">${S('grpDemo')}</div><h1>${S('varsling')}</h1>
      <p class="lede">${L('Kunder med tegn på betalingsproblemer. Lysvik Bank tar kontakt tidlig, tilbyr en løsning og henviser til gjeldsrådgivning før saken eventuelt overleveres til bankens eksterne inkassoselskap.','Customers showing signs of payment problems. Lysvik Bank makes contact early, offers a solution and refers to debt advice before the case is handed to the bank\'s external collection agency, if needed.')}</p></div>
    ${sampleBanner()}
    <div class="kpis">
      <div class="kpi t-acc"><span class="v">${act.length}</span><span class="l">${L('Aktive saker','Active cases')}</span></div>
      <div class="kpi t-bad"><span class="v">${LOANS.filter(l => risk(l) === 'hoy' && l.stage !== 'inkasso').length}</span><span class="l">${L('Høy risiko','High risk')}</span></div>
      <div class="kpi t-ok"><span class="v">${cnt('avtale')}</span><span class="l">${L('Avtale om løsning','Agreed solution')}</span></div>
      <div class="kpi t-warn"><span class="v">${cnt('inkasso')}</span><span class="l">${L('Overlevert til inkassoselskap, med tilbud dokumentert','Handed to collection agency, offer documented')}</span></div>
    </div>
    <div class="note"><b>${L('Bankens policy','Bank policy')}</b><span>${L('Banken krever av sin egen oppfølging at kunden har fått et tilbud før saken overleveres til inkassoselskapet. Det går lenger enn CCD2 art. 35, som krever rimelig imøtekommenhet før tvangsinndrivelse.','The bank requires its own follow-up to have made the customer an offer before the case is handed to the collection agency. This goes further than CCD2 Art. 35, which requires reasonable forbearance before enforcement.')}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>${L('Lån','Loan')}</th><th>${L('Kunde','Customer')}</th><th>${L('Land','Country')}</th><th>${L('Saldo','Balance')}</th><th>${L('Viktigste signal','Main signal')}</th><th>${L('Risiko','Risk')}</th><th>${L('Steg','Stage')}</th></tr></thead><tbody id="loanRows">
      ${[...LOANS].sort((x, y) => ({hoy:0, middels:1, lav:2})[risk(x)] - ({hoy:0, middels:1, lav:2})[risk(y)]).map(l => `<tr class="click" data-id="${l.id}" tabindex="0"><td class="mono">${l.id}</td><td>${esc(l.name)}</td><td>${flag(l.country)}</td><td class="num">${money(l.balance, COUNTRY[l.country].cur)}</td><td>${esc(tx(signals(l)[0] || Lg('–','–')))}</td><td>${rpillR(risk(l))}</td><td><span class="pill ${l.stage === 'inkasso' ? 'bad' : l.stage === 'avtale' ? 'ok' : 'acc'}">${stg(l.stage)}</span></td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}
AFTER.varsling = () => { $$('#loanRows tr.click').forEach(tr => { const go = () => location.hash = 'lan-' + tr.dataset.id; tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if(e.key === 'Enter') go(); }); }); };

let OFFER = { kind:'extend', extra:24 };
function vLan(l){
  const C = COUNTRY[l.country], si = STAGES.indexOf(l.stage);
  if(!l.offer){ let o = offerOpts(l, OFFER.kind); if(!o.length){ OFFER = { kind:'defer', extra:OFFERS.defer.opts[1] }; o = OFFERS.defer.opts; } if(!o.includes(OFFER.extra)) OFFER.extra = o[Math.min(1, o.length - 1)]; }
  const eff = offerEffect(l, l.offer || OFFER);
  const advice = l.country === 'SE' ? L('kommunal budsjett- og gjeldsrådgivning','municipal budget and debt advice') : L('Navs økonomiske rådgivning','Nav\'s financial advice service');
  const canOffer = ['signal','kontaktet','tilbud'].includes(l.stage);
  return `<div class="stack-l">
    <div class="stack"><a href="#varsling" style="font-size:13px">← ${S('varsling')}</a>
      <div class="row" style="justify-content:space-between"><h1 style="font-size:30px">${esc(l.name)}</h1>${rpillR(risk(l))}</div>
      <div class="stages">${STAGES.map((k,i) => `<span class="${i === si ? 'on' : i < si ? 'done' : ''}">${stg(k)}</span>`).join('')}</div></div>
    ${sampleBanner()}
    <div class="split">
      <div class="stack">
        <section class="panel"><h2 class="h-card">${L('Signaler','Signals')}</h2><div class="factors">${signals(l).map(s => `<div class="factor"><span class="ico warn">!</span><div>${esc(tx(s))}</div><span></span></div>`).join('') || `<p class="muted">${L('Ingen aktive signaler.','No active signals.')}</p>`}</div></section>
        <section class="panel"><h2 class="h-card">${L('Lånet','The loan')}</h2><dl class="meta"><dt>${L('Lån','Loan')}</dt><dd class="mono">${l.id}</dd><dt>${L('Produkt','Product')}</dt><dd>${prod(l.product)}</dd><dt>${L('Land','Country')}</dt><dd>${cn(l.country)}</dd><dt>${L('Saldo','Balance')}</dt><dd class="num">${money(l.balance, C.cur)}</dd><dt>${L('Rente','Interest')}</dt><dd class="num">${pct(l.rate, 1)}</dd><dt>${L('Styringsrente','Policy rate')}</dt><dd class="num">${pct(policyRate(l.country).v, 2)} <small class="muted">(${esc(apiName(policyRate(l.country).api))}, ${L('fiktiv','fictional')})</small></dd><dt>${L('Gjenstående','Remaining')}</dt><dd>${l.months} ${L('mnd.','months')}</dd><dt>${L('Månedlig beløp','Monthly payment')}</dt><dd class="num">${money(monthly(l), C.cur)}</dd></dl></section>
        <section class="panel"><h2 class="h-card">${L('Logg','Log')}</h2><ul class="log">${l.log.map(x => `<li><time>${fmtD(parseIso(x.d))}</time><span>${esc(tx(x.t))}</span></li>`).join('')}</ul></section>
      </div>
      <div class="stack sticky">
        <section class="panel stack"><h2 class="h-card">${l.offer ? L('Tilbudet','The offer') : L('Velg tilbud','Choose an offer')}</h2>
          ${l.offer ? `<div class="suggest"><b>${esc((s => s.charAt(0).toUpperCase() + s.slice(1))(offerName(l.offer, LANG === 'en' ? 'en' : 'no')))}</b><span class="muted" style="font-size:13px">${L('Gitt','Made')} ${fmtD(parseIso(l.offer.dateIso))} · ${L('henvist til','referred to')} ${advice}</span></div>`
          : `<div class="choice" role="radiogroup" aria-label="${L('Type tilbud','Type of offer')}">${Object.keys(OFFERS).map(k => `<label><input type="radio" name="ok" value="${k}" ${OFFER.kind === k ? 'checked' : ''} ${offerOpts(l, k).length ? '' : 'disabled'}> ${L(...OFFERS[k].t)}</label>`).join('')}</div>
            ${!offerOpts(l, 'extend').length ? `<p class="muted" style="font-size:12.5px; margin:0">${L('Lengre nedbetalingstid er ikke mulig: forbrukslån må nedbetales innen 5 år i Norge (utlånsforskriften § 13).','A longer repayment period is not possible: consumer loans must be repaid within 5 years in Norway (lending regulation s. 13).')}</p>` : ''}
            <label class="f">${L('Omfang','Extent')}<select id="offerExtra">${offerOpts(l, OFFER.kind).map(v => `<option value="${v}" ${v === OFFER.extra ? 'selected' : ''}>${v} ${L(...OFFERS[OFFER.kind].unit)}</option>`).join('')}</select></label>`}
          <div class="cmp"><div><small>${L('Per måned i dag','Per month today')}</small><b>${money(eff.now, C.cur)}</b></div><div><small>${L('Per måned med tilbudet','Per month with the offer')}</small><b>${money(eff.after, C.cur)}</b></div></div>
          <p class="muted" style="font-size:13px">${esc(tx(eff.note))}</p>
          ${canOffer && !l.offer ? `<label class="chk"><input type="checkbox" id="offAdvice" checked><span>${L(`Henvis til ${advice}`, `Refer to ${advice}`)}<small>${l.country === 'SE' ? L('CCD2 art. 36(3), gjennomført i konsumentkreditlagen','CCD2 Art. 36(3), implemented in the Consumer Credit Act') : L('Lysvik Banks policy','Lysvik Bank\'s policy')}</small></span></label>` : ''}
          ${!['avtale','inkasso'].includes(l.stage) && l.offer ? agencyCheck(l) : ''}
          <div class="row">
            ${l.stage === 'signal' ? `<button class="btn" id="actContact">${L('Registrer kontakt','Register contact')}</button>` : ''}
            ${canOffer && !l.offer ? `<button class="btn primary" id="actOffer">${L('Send tilbud til kunden','Send offer to the customer')}</button>` : ''}
            ${l.stage === 'tilbud' ? `<button class="btn primary" id="actAgree">${L('Kunden godtar','Customer accepts')}</button>` : ''}
            ${!['avtale','inkasso'].includes(l.stage) ? `<button class="btn danger" id="actColl" ${l.offer ? '' : 'disabled aria-disabled="true"'}>${L('Overlever til inkassoselskap','Hand to collection agency')}</button>` : ''}
          </div>
          ${!l.offer && !['avtale','inkasso'].includes(l.stage) ? `<p class="muted" style="font-size:12.5px">${L('Overlevering til inkassoselskapet er sperret til et tilbud er gitt og dokumentert.','Handover to the collection agency is blocked until an offer has been made and documented.')}</p>` : ''}
        </section>
        <section class="panel"><h2 class="h-card">${L(`Regler i ${cn(l.country)}`, `Rules in ${cn(l.country)}`)}</h2><ul class="rights">
          ${l.country === 'SE' ? `<li><span>${L('Rutiner for tidlig oppdagelse','Early detection procedures')}</span>${rpill(new Date() < new Date(2026, 10, 20) ? 'from' : 'law')}<small>${L('Konsumentkreditlagen 6 kap. 11 § (CCD2 art. 36(2))','Consumer Credit Act ch. 6 s. 11 (CCD2 Art. 36(2))')}</small></li><li><span>${L('Alternativer før tvangsinndrivelse','Alternatives before enforcement')}</span>${rpill(new Date() < new Date(2026, 10, 20) ? 'from' : 'law')}<small>${L('Konsumentkreditlagen 6 kap. 12 § (CCD2 art. 35)','Consumer Credit Act ch. 6 s. 12 (CCD2 Art. 35)')}</small></li>`
          : `<li><span>${L('Tidlig oppdagelse og imøtekommenhet','Early detection and forbearance')}</span>${rpill('coming')}<small>${L('CCD2 art. 35–36. Ikke tatt inn i EØS-avtalen ennå.','CCD2 Art. 35–36. Not yet part of the EEA Agreement.')}</small></li><li><span>${L('Tilpasset inndriving og pause (gjelder inkassoselskapet)','Adapted collection and pause (applies to the collection agency)')}</span>${rpill('coming')}<small>${L('Ny inkassolov §§ 14 og 17, vedtatt 21.4.2026, ikke i kraft','New Debt Collection Act ss. 14 and 17, passed 21.4.2026, not in force')}</small></li>`}
          <li><span>${L('Tilbud før overlevering til inkasso','Offer before handover to collection')}</span>${rpill('policy')}<small>${L('Lysvik Banks policy i begge land','Lysvik Bank\'s policy in both countries')}</small></li>
        </ul></section>
      </div>
    </div></div>`;
}
AFTER.lan = h => {
  const l = loanById(h.slice(4)); if(!l) return;
  $$('input[name=ok]').forEach(r => r.addEventListener('change', () => { const o = offerOpts(l, r.value); OFFER = { kind:r.value, extra:o[Math.min(1, o.length - 1)] }; render(); }));
  const ex = $('#offerExtra'); if(ex) ex.addEventListener('change', () => { OFFER.extra = Number(ex.value); render(); });
  const now = iso(TODAY);
  const c = $('#actContact'); if(c) c.addEventListener('click', () => { l.stage = 'kontaktet'; l.log.push({ d:now, t:Lg('Kunden kontaktet i nettbanken og på SMS','Customer contacted in online banking and by text message') }); saveLoans(); render(); toast(L('Kontakt registrert','Contact registered')); });
  const o = $('#actOffer'); if(o) o.addEventListener('click', () => {
    if(!$('#offAdvice').checked){ toast(L('Henvis kunden til gjeldsrådgivning','Refer the customer to debt advice')); return; }
    l.offer = { ...OFFER, dateIso:now }; l.stage = 'tilbud';
    l.log.push({ d:now, t:Lg(`Tilbud gitt: ${offerName(l.offer, 'no')}. Henvist til gjeldsrådgivning.`, `Offer made: ${offerName(l.offer, 'en')}. Referred to debt advice.`) });
    saveLoans(); render(); toast(L('Tilbudet er sendt og dokumentert','The offer is sent and documented'));
  });
  const a = $('#actAgree'); if(a) a.addEventListener('click', () => { l.stage = 'avtale'; l.log.push({ d:now, t:Lg('Kunden godtok tilbudet','The customer accepted the offer') }); saveLoans(); render(); toast(L('Avtalen er registrert','The agreement is registered')); });
  const k = $('#actColl'); if(k) k.addEventListener('click', () => { if(!l.offer) return; l.stage = 'inkasso'; l.log.push({ d:now, t:Lg('Overlevert til inkassoselskapet med dokumentasjon av tilbud og kontakt','Handed to the collection agency with documentation of the offer and contact') }); if(l.country === 'NO') l.log.splice(l.log.length-1, 0, { d:now, t:Lg('Inkassobevilling kontrollert i Finanstilsynets register','Debt collection licence checked in the Financial Supervisory Authority register') }); saveLoans(); render(); toast(L('Overlevert til inkassoselskapet','Handed to the collection agency')); });
};

// ---------- Innsikt og etterlevelse ----------
function vInnsikt(){
  const rej = APPS.filter(a => assess(a).outcome === 'avslag' && a.auto);
  const req = APPS.filter(a => a.request);
  const done = req.filter(a => a.review);
  const chg = done.filter(a => a.review.decision === 'innvilget').length;
  const times = done.map(a => daysBetween(parseIso(a.request.date), parseIso(a.review.date))).sort((x, y) => x - y);
  const med = times.length ? times[Math.floor(times.length/2)] : null;
  const dialog = LOANS.filter(l => ['kontaktet','tilbud','avtale'].includes(l.stage));
  const byC = c => ({ apps:APPS.filter(a => a.country === c).length, rej:rej.filter(a => a.country === c).length, req:req.filter(a => a.country === c).length, loans:LOANS.filter(l => l.country === c).length });
  const ai = [
    [Lg('Konsekvensvurdering for grunnleggende rettigheter','Fundamental rights impact assessment'), 'art. 27', 'warn', Lg('Påbegynt','Started')],
    [Lg('Menneskelig tilsyn som kan overstyre','Human oversight that can override'), 'art. 14, 26', 'ok', Lg('Ny vurdering på plass','Review in place')],
    [Lg('Logg i minst seks måneder','Logs for at least six months'), 'art. 26(6)', 'ok', Lg('Alle steg logges','All steps logged')],
    [Lg('Informere personer om bruk av systemet','Inform persons about the use of the system'), 'art. 26(11)', 'ok', Lg('Står i forklaringen','Included in the explanation')],
    [Lg('Forklaring av beslutninger','Explanation of decisions'), 'art. 86', 'ok', Lg('Forklaringsmodulen','Explanation module')]
  ];
  return `<div class="stack-l">
    <div class="stack"><div class="eyebrow">${S('grpDemo')}</div><h1>${S('innsikt')}</h1>
      <p class="lede">${L('Måltallene fra løsningsforslaget og status mot kravene i CCD2 og AI Act.','The measures from the proposal and status against the requirements of CCD2 and the AI Act.')}</p></div>
    ${sampleBanner()}
    <div class="kpis">
      <div class="kpi t-ok"><span class="v">${rej.length ? pct(100) : '–'}</span><span class="l">${L('Automatiske avslag med forklaring levert','Automated rejections with explanation delivered')}</span></div>
      <div class="kpi t-acc"><span class="v">${req.length}</span><span class="l">${L(`Forespørsler om ny vurdering, ${chg} av ${done.length} endret`, `Review requests, ${chg} of ${done.length} changed`)}</span></div>
      <div class="kpi t-info"><span class="v">${med == null ? '–' : med + ' ' + L('d','d')}</span><span class="l">${L('Median tid fra forespørsel til svar','Median time from request to answer')}</span></div>
      <div class="kpi t-ok"><span class="v">${dialog.length}</span><span class="l">${L(`Kunder i tidlig dialog, ${LOANS.filter(l => l.stage === 'avtale').length} med avtale`, `Customers in early dialogue, ${LOANS.filter(l => l.stage === 'avtale').length} with an agreement`)}</span></div>
    </div>
    <section class="stack"><h2>${L('Per land','By country')}</h2>
      <div class="tbl-wrap"><table><thead><tr><th>${L('Land','Country')}</th><th>${L('Søknader','Applications')}</th><th>${L('Automatiske avslag','Automated rejections')}</th><th>${L('Forespørsler om ny vurdering','Review requests')}</th><th>${L('Lån i tidlig varsling','Loans in early warning')}</th><th>CCD2</th></tr></thead><tbody>
      ${['NO','SE'].map(c => { const b = byC(c); return `<tr><td>${flag(c)} ${cn(c)}</td><td class="num">${b.apps}</td><td class="num">${b.rej}</td><td class="num">${b.req}</td><td class="num">${b.loans}</td><td>${c === 'SE' ? `<span class="pill ok">${L('Gjelder fra 20.11.2026','Applies from 20 Nov 2026')}</span>` : `<span class="pill info">${L('Dato ikke fastsatt','No date set')}</span>`}</td></tr>`; }).join('')}
      </tbody></table></div></section>
    <section class="stack"><h2>${L('Bakgrunn fra åpne data','Background from open data')}</h2>
      <div class="kpis">${API_DATA.ssb.map(x => `<div class="kpi"><span class="v">${pct(x.v, x.u === 'pct' ? 1 : 0)}</span><span class="l">${tx(x.t)} <span class="mono muted">(${L('tabell','table')} ${x.tab})</span></span></div>`).join('')}</div>
      <div class="row" style="gap:8px 16px">${apiTag('ssb')}<span class="muted" style="font-size:13px">${L('Styringsrente','Policy rate')}: ${cn('NO')} ${pct(policyRate('NO').v, 2)}, ${cn('SE')} ${pct(policyRate('SE').v, 2)}</span></div>
      <p class="muted" style="font-size:13px">${L('Tallene settes ved siden av bankens egne måltall, for eksempel for å se om flere ber om hjelp når arbeidsledigheten stiger. SSB-tallene gjelder Norge.','The figures are shown next to the bank\'s own measures, for example to see whether more customers ask for help when unemployment rises. The SSB figures apply to Norway.')}</p></section>
    <section class="stack"><div class="panel-h" style="margin:0"><h2>${L('AI Act: høyrisikokrav for kredittscoring','AI Act: high-risk requirements for credit scoring')}</h2><span class="pill acc">${L(`${daysTo(D_AIACT)} dager til 2.12.2027`, `${daysTo(D_AIACT)} days to 2 Dec 2027`)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>${L('Krav','Requirement')}</th><th>${L('Hjemmel','Basis')}</th><th>Status</th></tr></thead><tbody>
      ${ai.map(r => `<tr><td>${tx(r[0])}</td><td class="mono">${r[1]}</td><td><span class="pill ${r[2]}">${tx(r[3])}</span></td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:13px">${L('Status er eksempeldata. Kravene gjelder hvis bankens kredittmodell er et AI-system etter art. 3(1). AI Act er ikke tatt inn i EØS-avtalen ennå.','Status is sample data. The requirements apply if the bank\'s credit model is an AI system under Art. 3(1). The AI Act is not yet part of the EEA Agreement.')}</p></section>
  </div>`;
}

// ---------- Oppstart ----------
function setLang(x){ LANG = x; try{ sessionStorage.setItem('ci_lang', x); }catch(e){} render(); }
$$('#langSwitch button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('#resetBtn').addEventListener('click', () => { ['ci_apps2','ci_loans2'].forEach(store.del); REQ_FORM = false; BC = { ...BC_DEF }; OFFER = { kind:'extend', extra:24 }; FILTER = { land:'alle', st:'alle' }; load(); render(); toast(L('Demodataene er tilbakestilt','The demo data has been reset')); });
window.addEventListener('hashchange', () => { REQ_FORM = false; render(); });
load(); render();
</script>
